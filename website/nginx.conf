server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docusaurus emits a static tree (dir/index.html). Resolve clean URLs to
    # the directory index or the .html file, falling back to the 404 page.
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    # Long-cache fingerprinted assets; HTML stays revalidated.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
